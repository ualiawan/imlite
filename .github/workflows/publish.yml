name: Publish

# Publishes to PyPI when a version tag is pushed:
#
#   git tag -a v0.1.0 -m "imlite 0.1.0" && git push origin v0.1.0
#
# A tag push is the only trigger. There is deliberately no workflow_dispatch:
# the version comes from the tag, so a manual run has nothing to release, and
# releasing by hand is exactly the thing that publishes the wrong version.
# Docs deploy separately, in docs.yml, so a documentation fix does not need a
# release to go live.
#
# Authentication uses PyPI Trusted Publishing (OIDC), so there is no API token
# in repository secrets. One-time setup at https://pypi.org/manage/account/publishing/:
#   PyPI project py-imlite | owner ualiawan | repo imlite
#   workflow publish.yml   | environment pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7

      # A PyPI version can never be re-uploaded, so a tag that disagrees with
      # the package must stop here rather than burn the version number.
      - name: Check the tag matches _version.py
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/imlite/_version.py)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match __version__ $pkg in src/imlite/_version.py"
            exit 1
          fi
          echo "Publishing version $pkg"

      - run: uv build
      - run: uvx twine check dist/*

      # Losing py.typed silently downgrades type checking for every downstream
      # user, and nothing else would notice.
      - name: Verify py.typed ships in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'imlite/py.typed' \
            || { echo "::error::py.typed missing from the wheel"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/py-imlite
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
