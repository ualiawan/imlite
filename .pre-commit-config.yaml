# Mirrors the CI gate in .github/workflows/ci.yml: ruff (lint + format) and
# mypy --strict. Black, isort and flake8 were removed - ruff replaces all three
# and is configured in pyproject.toml, so having both meant two sources of truth.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        files: ^src/imlite/
        additional_dependencies:
          - numpy>=1.23
          - types-tqdm
